# ============================================================
# RF fan controller: three Pacific ceiling fans and one NEC-remote fan
# ============================================================
# Everything fan-specific lives in the pacific_fan component
# (../components/pacific_fan); see the README for how it works.
#
# Wiring (ESP32 -> CC1101), the component's defaults:
#   GPIO 18 -> SCK        GPIO 5  -> CSN
#   GPIO 19 -> MISO       GPIO 25 -> GDO0 (TX data)
#   GPIO 23 -> MOSI       GPIO 26 -> GDO2 (RX data)
# ============================================================

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components
    components: [pacific_fan]

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

web_server:
  port: 80

# The fans' state must survive a reboot: power and F/R are toggles, so
# without it there is nothing to reason about.
preferences:
  flash_write_interval: 5s

pacific_fan:
  id: fan_radio
  fans:
    - name: Girls
      address: 0xE5D7C
      parity: even
    - name: Office
      address: 0xAACAC
      parity: odd
    - name: Ofek
      address: 0xB19BC
      parity: even
    - name: Balcony
      protocol: nec
      address: 0x2882
      dim_steps: 13      # 12 presses from minimum to maximum

# ── Raw sender, for mapping unknown buttons ──
button:
  - platform: template
    name: "Send Raw Command"
    icon: "mdi:send"
    entity_category: config
    on_press:
      - lambda: |-
          uint32_t addr = std::strtoul(id(raw_target).current_option().c_str(), nullptr, 16);
          id(fan_radio).send(addr, (uint16_t) id(raw_cmd_code).state);

select:
  - platform: template
    id: raw_target
    name: "Raw Command Target"
    entity_category: config
    optimistic: true
    options:
      - "E5D7C"          # girls
      - "AACAC"          # office
      - "B19BC"          # ofek
      - "2882"           # balcony (NEC: commands are 0-255)

number:
  # ── For measuring what the fans need; back to the defaults on reboot ──
  - platform: template
    name: "TX Repeats Override"
    icon: "mdi:repeat"
    entity_category: config
    optimistic: true
    min_value: 0           # 0 = each family's default
    max_value: 20
    step: 1
    initial_value: 0
    mode: box
    set_action:
      - lambda: id(fan_radio).repeats_override = (int) x;
  - platform: template
    name: "Same-Command Gap Override"
    icon: "mdi:timer-pause-outline"
    entity_category: config
    optimistic: true
    unit_of_measurement: ms
    min_value: -1          # -1 = each family's default
    max_value: 2000
    step: 1
    initial_value: -1
    mode: box
    set_action:
      - lambda: id(fan_radio).same_gap_override_ms = (int) x;
  - platform: template
    id: raw_cmd_code
    name: "Raw Command Code"
    icon: "mdi:console"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 511
    step: 1
    initial_value: 0
    mode: box
